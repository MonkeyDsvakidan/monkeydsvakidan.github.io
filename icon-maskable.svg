    <path d="M350 182c14-30 32-42 56-38-24 14-34 36-40 60z" fill="#ff8a3d"/>
    <path d="M196 160c4-46 28-80 60-96 32 16 56 50 60 96z" fill="#ffd166"/>
    <path d="M150 196c24-30 64-44 106-44s82 14 106 44l-8 16H158z" fill="#2a2830"/>
    <circle cx="106" cy="144" r="13" fill="#c9c4d3"/>
    <circle cx="406" cy="144" r="13" fill="#c9c4d3"/>
    <circle cx="256" cy="62" r="13" fill="#c9c4d3"/>
    <!-- Maske -->
    <path d="M256 196c-64 0-104 30-104 92 0 40 12 70 30 92 18 22 44 36 74 36s56-14 74-36c18-22 30-52 30-92 0-62-40-92-104-92z" fill="#ece7df"/>
