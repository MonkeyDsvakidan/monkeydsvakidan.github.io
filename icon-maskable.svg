    <!-- breites Grinsen bis zu den Wangen, mit Zähnen -->
    <path d="M178 336c18 46 54 60 78 60s60-14 78-60c-40 18-116 18-156 0z" fill="#151419"/>
    <path d="M206 346l8 18 10-16 10 20 10-20 12 22 12-22 10 20 10-20 10 16 8-18" fill="#ece7df"/>
    <path d="M178 336c-6-6-8-14-6-22M334 336c6-6 8-14 6-22" stroke="#d42a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
