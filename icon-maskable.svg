<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- GameMaster-Symbol: eigene Spielleiter-Maske mit Narrenkappe (Zipfel in den Spielfarben). Android-Variante: alles im inneren 80-%-Kreis (maskable). -->
