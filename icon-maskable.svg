    <circle cx="219" cy="281" r="10" fill="#ff3b3b"/>
    <path d="M274 272c16-14 40-14 56 0-14 20-42 20-56 0z" fill="#151419"/>
    <circle cx="302" cy="275" r="7" fill="#ff3b3b"/>
